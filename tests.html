<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Тесты metrics.js</title>
<style>body{font:14px system-ui;background:#0b0b0c;color:#f2f2f3;padding:16px}li{margin:4px 0;font-family:monospace}.fail{font-weight:700;text-decoration:underline}</style>
</head>
<body>
<h1>Тесты metrics.js</h1>
<p id="summary"></p><ul id="out"></ul>
<script type="module">
import * as M from "./js/metrics.js";
const out = document.getElementById("out");
let passed = 0, failed = 0;
function test(name, fn) {
  try { fn(); passed++; out.insertAdjacentHTML("beforeend", `<li>✓ ${name}</li>`); }
  catch (e) { failed++; out.insertAdjacentHTML("beforeend", `<li class="fail">✗ ${name}: ${e.message}</li>`); console.error(name, e); }
}
function assert(c, msg) { if (!c) throw new Error(msg || "assert"); }
const near = (a, b, eps = 1e-6) => assert(Math.abs(a - b) < eps, `${a} ≠ ${b}`);
const set = (weight, reps, extra = {}) => ({ weight, reps, done: true, isWarmup: false, ...extra });
const entry = (id, sets, unit = "kg") => ({ exerciseId: id, exerciseName: id, unit, sets });
const sess = (entries, dur, start = 0, id = "s") => ({ id, entries, durationMin: dur, startedAt: start });

test("lb → кг", () => near(M.toKg(10, "lb"), 4.5359237));
test("Эпли без RPE: 100×5 → 116.67", () => near(M.epley(100, 5), 100 * (1 + 5 / 30)));
test("Эпли с RPE 8: reps_eff = reps + 2", () => near(M.epley(100, 5, 8), 100 * (1 + 7 / 30)));
test("объём игнорирует разминку и невыполненные", () => {
  const e = entry("a", [set(100, 5), set(50, 10, { isWarmup: true }), set(100, 5, { done: false })]);
  near(M.entryVolume(e), 500);
});
test("объём в lb приводится к кг", () => near(M.entryVolume(entry("a", [set(10, 10)], "lb")), 45.359237));
test("e1RM: сеты >12 повторов не участвуют", () => {
  const e = entry("a", [set(100, 5), set(60, 15)]);
  near(M.entryE1rm(e), 100 * (1 + 5 / 30));
});
test("e1RM = null, если нет подходящих сетов", () => assert(M.entryE1rm(entry("a", [set(40, 20)])) === null));
test("длительность > 180 мин не используется", () => assert(M.usableDuration({ durationMin: 181 }) === null));
test("длительность неизвестна → null", () => assert(M.usableDuration({}) === null));
test("LI baseline против себя = 100", () => {
  const s = sess([entry("a", [set(100, 5), set(100, 5)])], 60);
  near(M.loadIndex(s, s).li, 100);
});
test("LI: +10% по всем компонентам = 110", () => {
  const b = sess([entry("a", [set(100, 10)])], 50);
  // объём ×1.1, e1RM ×1.1 (тот же вес и повторы ×1.1 неточно) — берём вес ×1.1
  const c = sess([entry("a", [set(110, 10)])], 50);
  near(M.loadIndex(c, b).li, 110);
});
test("LI без длительности: вес плотности перераспределяется", () => {
  const b = sess([entry("a", [set(100, 10)])], null);
  const c = sess([entry("a", [set(110, 10)])], null);
  const r = M.loadIndex(c, b);
  assert(!r.used.includes("density"));
  near(r.li, 110);
});
test("LI: только пересечение упражнений", () => {
  const b = sess([entry("a", [set(100, 10)]), entry("x", [set(500, 10)])], 60);
  const c = sess([entry("a", [set(100, 10)]), entry("y", [set(900, 10)])], 60);
  near(M.loadIndex(c, b).li, 100);
});
test("LI = null без пересечения", () => {
  const b = sess([entry("a", [set(100, 10)])], 60);
  const c = sess([entry("b", [set(100, 10)])], 60);
  assert(M.loadIndex(c, b) === null);
});
test("веса компонентов в сумме = 1", () => near(M.LI_WEIGHTS.volume + M.LI_WEIGHTS.e1rm + M.LI_WEIGHTS.density, 1));
test("скользящее среднее по 4 точкам", () => {
  const r = M.movingAverage([100, 102, 104, 106, 108], 4);
  near(r[3], 103); near(r[4], 105); near(r[0], 100);
});
test("pickBaseline: первая тренировка, либо заданная", () => {
  const list = [sess([], 1, 20, "b"), sess([], 1, 10, "a")];
  assert(M.pickBaseline(list).id === "a");
  assert(M.pickBaseline(list, "b").id === "b");
});
test("liSeries: после сброса baseline старые тренировки скрыты", () => {
  const mk = (id, t, w) => sess([entry("a", [set(w, 10)])], 60, t, id);
  const list = [mk("1", 1, 100), mk("2", 2, 110), mk("3", 3, 120)];
  const ser = M.liSeries(list, "2");
  assert(ser.length === 2 && ser[0].session.id === "2");
  near(ser[0].li, 100);
});
test("сравнение с прошлой тренировкой в %", () => {
  const p = sess([entry("a", [set(100, 10)])], 60), c = sess([entry("a", [set(100, 11)])], 60);
  near(M.compareWithPrevious(c, p), 10);
});
test("изменение индекса за N недель", () => {
  const day = 864e5;
  const ser = [0, 10, 20, 30].map((d, i) => ({ session: { startedAt: d * day }, li: 100 + i * 5 }));
  near(M.changeOverWeeks(ser, 4), 15);
});
document.getElementById("summary").textContent = `Пройдено: ${passed}, провалено: ${failed}`;
</script>
</body>
</html>
