plugins {
    id 'com.android.application'
}

android {
    namespace 'com.max1340.fitnessapp'
    compileSdk 34

    defaultConfig {
        applicationId "com.max1340.fitnessapp"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    signingConfigs {
        release {
            storeFile file('../android.keystore')
            storePassword 'fitness123'
            keyAlias 'android'
            keyPassword 'fitness123'
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Zero extra external dependencies for a lightweight pure native webview
}
