<!doctype html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Тренировки</title>
  <meta name="description" content="Учёт силовых тренировок: программы, сеты, таймер отдыха, прогресс.">
  <meta name="theme-color" content="#0b0b0c">
  <meta name="color-scheme" content="dark light">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Тренировки">
  <link rel="stylesheet" href="styles.css">
  <script>
    // Применяем тему до первой отрисовки, чтобы не было вспышки.
    try {
      var t = (JSON.parse(localStorage.getItem("fitness.settings.v1") || "{}")).theme || "dark";
      var dark = t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.dataset.theme = dark ? "dark" : "light";
      document.querySelector('meta[name="theme-color"]').content = dark ? "#0b0b0c" : "#f6f6f7";
    } catch (e) {}
  </script>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <h1 id="title">Тренировка</h1>
      <span id="sync" class="sync" hidden></span>
      <button id="settings-btn" class="btn icon" type="button" aria-label="Настройки" title="Настройки">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>
      </button>
    </header>
    <main id="view" class="view"><p id="splash" class="empty">Загрузка…</p></main>
    <div id="timer-bar" class="timer-bar" role="timer" hidden></div>
    <nav id="nav" class="nav" aria-label="Основная навигация"></nav>
  </div>
  <div id="sheets"></div>
  <div id="toast" class="toast" role="status" hidden></div>
  <noscript>Для работы приложения нужен JavaScript.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
