<!doctype html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Тренировки</title>
  <meta name="description" content="Учёт силовых тренировок: программы, сеты, таймер отдыха, прогресс.">
  <meta name="theme-color" content="#0b0b0c">
  <meta name="color-scheme" content="dark light">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Тренировки">
  <link rel="stylesheet" href="styles.css">
  <script>
    // Применяем тему и язык до первой отрисовки, чтобы не было вспышки.
    try {
      var st = JSON.parse(localStorage.getItem("fitness.settings.v1") || "{}");
      var t = st.theme || "dark";
      var dark = t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.dataset.theme = dark ? "dark" : "light";
      document.querySelector('meta[name="theme-color"]').content = dark ? "#0b0b0c" : "#f6f6f7";
      var lang = st.lang || (/^(ru|uk|be|kk)\b/i.test(navigator.language || "ru") ? "ru" : "en");
      document.documentElement.lang = lang;
      if (lang === "en") {
        document.title = "Workouts";
        window.__initEn = true;
      }
    } catch (e) {}
  </script>
</head>
<body>
  <div id="splash" class="splash" role="status" aria-live="polite">
    <div class="splash-box">
      <svg class="splash-logo" viewBox="0 0 64 64" width="56" height="56" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M8 24v16M16 18v28M48 18v28M56 24v16M16 32h32"/>
      </svg>
      <strong class="splash-title">ТРЕНИРОВКИ</strong>
      <div class="splash-track" aria-hidden="true">
        <div id="splash-bar" class="splash-fill"></div>
      </div>
      <small id="splash-text" class="splash-sub">Загрузка данных…</small>
    </div>
  </div>
  <script>
    if (window.__initEn) {
      var stEl = document.querySelector(".splash-title"); if (stEl) stEl.textContent = "WORKOUTS";
      var sbEl = document.getElementById("splash-text"); if (sbEl) sbEl.textContent = "Loading data…";
    }
  </script>
  <div id="app">
    <header class="topbar">
      <h1 id="title">Тренировка</h1>
      <span id="sync" class="sync" hidden></span>
      <button id="settings-btn" class="btn icon" type="button" aria-label="Настройки" title="Настройки">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2.2"/><circle cx="8" cy="17" r="2.2"/></svg>
      </button>
    </header>
    <main id="view" class="view"></main>
    <div id="timer-bar" class="timer-bar" role="timer" hidden></div>
    <nav id="nav" class="nav" aria-label="Основная навигация"></nav>
  </div>
  <div id="sheets"></div>
  <div id="toast" class="toast" role="status" hidden></div>
  <noscript>Для работы приложения нужен JavaScript. / JavaScript is required to run this app.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
